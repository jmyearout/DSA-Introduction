# yaml-language-server: $schema=https://vscodeedu.com/assets/schema/course-v2.schema.json
id: lessonpart2
title: "Part 1: The Small Dataset"
content: >
  ### When Everything Seems Fine


  Scenario: You are building part of a school information system that tracks
  student ID numbers for students who have logged in today. To keep our
  simulation extremely simple, we will just build a dataset of sequential
  numbers, which of course would be TERRIBLE in real practice. Why is that?


  **Step 1: Create A Small List**


  Use the following code to generate a list of IDs from 1 to 100 in the
  studentIDsList.py file provided.


  ```

  student_ids = []


  for i in range(1, 101):
      student_ids.append(i)
  ```


  What code can you add to check and see if you have successfully created the
  list of numbers? Comment out or delete what you create to test this when it is
  no longer needed.


  **Step 2: Check If An ID Exists**


  Add the following code to test if an ID exists in the list. Before you run it,
  predict what your results should be.


  ```

  print(50 in student_ids)

  print(150 in student_ids)

  ```


  Were your predictions correct? Can you explain why you got the results that
  appeared? EXTENSION: Add some code to your print statements above so that a
  user knows what the results are referring to.


  **Step 3: Remove An ID**


  Add the following code to remove and ID and then test to see if it no longer
  there. Again, predict what your results should be.


  ```

  student_ids.remove(30)

  print(30 in student_ids)

  ```


  Were your predictions correct, and can you explain why?
showEditor: true
editors:
  - course1/studentIDsList.py
questionGroups:
  - id: "1"
    questions:
      - id: "1"
        type: reflection
        content: With a dataset of this size, does the performance seem slow or fast?
  - id: "2"
    questions:
      - id: "1"
        type: reflection
        content: Based on what you have seen so far, would you say lists are a "bad"
          choice? Why or why not?
