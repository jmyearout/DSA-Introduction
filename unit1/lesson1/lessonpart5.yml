  ### What Makes Sets Faster Than Lists In Python?

  **Down Into The Weeds We Go - Big O**

  So clearly we saw that the use of a set was significantly faster than the list implementation. Yet most of the "surface" code that we could see really didn't differ much, if at all. It should be obvious that how things are operating "under the hood" is the reason for the differences in runtime.

  This gets into a very big thing in the world of data structures - time complexity. This is a whole world unto itself in computing, but here we will just touch on a few key items.

  First of all, you will often see time complexity in terms of "Big O".  In a nutshell:

  > With Big O Notation we express the runtime in terms of — *how quickly it grows relative to the input, as the input gets larger*. [A Simplified Explanation of the Big O Notation | by Karuna Sehgal | Karuna Sehgal | Medium](https://medium.com/karuna-sehgal/a-simplified-explanation-of-the-big-o-notation-82523585e835)

  Ideally of course you want your computational time to be as fast as possible no matter the number of inputs. This graph from [How to calculate Big O notation time complexity | Stackademic ](https://blog.stackademic.com/how-to-calculate-big-o-notation-time-complexity-5504bed8d292)shows this quite well:

  ![1.00](data:image/webp;base64,)

  Take a look at this function:

  ```
  def contains(lst, target):
      for item in lst:
          if item == target:
              return True
      return False
  ```

  Consider the following assuming the target is NOT in the list "lst".

  ```
  +--------------+-----------------+
  | Size Of List | Max Comparisons |
  +--------------+-----------------+
  | 10           |                 |
  | 100          |                 |
  | 1000         |                 |
  | n            |                 |
  +--------------+-----------------+
  ```

  How does the number of comparisons change as the list gets bigger? Will the function have to go through the entire list to make sure the target is not there? So which Big O do you think this would be?

  If you were thinking O(n) Linear, you were right! Now this might not be a big deal with a smaller list size, but what if our ID list had a million IDs to deal with? And it was being used multiple times per second? This is where the issue of scale comes into play, and we need to find better ways of dealing with the data than traversing through potentially the entire list to find something.

  **Python Sets Are "Hashy"**

  So this is where the dive goes a little farther. A set is definitely a standard structure within the realm of data structures. The way it is used conceptually in coding in Python is accurate to the general concept you would find about sets. But "under the hood" a Python set uses yet another type of data structure to crank up its speed, the hash table.

  A hash table is oriented on using keys and values, which then lets us test for things like membership much more easily. A hash function creates a key that maps to a specific place in the array (often called a "bucket") where the value is stored. To see if an item is there, the key being checked simply has to be hashed, and then that hash is checked against the array to see if the same hash value is there or not. Instead of a list process, where it has to look at the values index by index to locate a potential match.

  ![1.00](data:image/jpeg;base64, "https://en.wikipedia.org/wiki/Hash_table")

  Here is an imperfect real-world analogy that hopefully helps clarify:

  > Let's say I have a five-drawer dresser, and I keep my socks in the second drawer from the bottom (drawer 4).
  >
  > I ask my friend to put my socks in the dresser without giving any further information. He has to look through the dresser, drawer by drawer, in order to find the sock drawer. That would be O(n) since in the worst case it could take looking through all drawers to find the right one. (n is the number of drawers)
  >
  > Now let's do the same thing, but this time I tell my friend they go in drawer 4. He now has the key, and can go directly to drawer 4 to put the socks away. This woudl be O(1) because in the worst case it should take just one drawer to go into.
  >
  > (Analogy source: https\://stackoverflow\.com/a/8929445)

  Now that you hopefully have a basic understanding of the hash table, visit the following webpage to see a comparison of Python sets vs. lists in terms of time complexity. There is a really good comparison table as well as a small code snippet that you can experiment with if you would like.

  [Python - What Makes Sets Faster Than Lists ? - GeeksforGeeks](https://www.geeksforgeeks.org/python/python-what-makes-sets-faster-than-lists/)
